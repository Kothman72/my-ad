<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Habit Tracker</h1>
      <p id="today-label"></p>
      <p id="progress" class="progress"></p>
    </header>

    <form id="habit-form" autocomplete="off">
      <input id="habit-input" type="text" maxlength="60" required
             placeholder="New habit, e.g. Read 10 pages" aria-label="Habit name">
      <select id="habit-category" aria-label="Habit category">
        <option value="Health">Health</option>
        <option value="Work">Work</option>
        <option value="Learning">Learning</option>
        <option value="Personal">Personal</option>
      </select>
      <button type="submit">Add habit</button>
    </form>

    <div id="category-filter" class="category-filter" aria-label="Filter habits by category"></div>
    <ul id="habit-list"></ul>
    <p id="empty-state" hidden>No habits yet. Add your first one above.</p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
